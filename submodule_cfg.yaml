# Configuration file for optional submodules
# Default as minimal installation, with only mujoco_viewer


# For MujocoEnv and Kinematics Visualization
# can be skipped on real robot
mujoco_viewer: 
  install: true
  path: third_party/mujoco_viewer
  # Visualization and MuJoCo compatibility fixes are included in the fork commit.


# Python binding for Unitree SDK2, https://github.com/zdYukino/unitree_cpp
# need to install Unitree SDK2 first
unitree_cpp:
  install: false
  path: packages/unitree_cpp
  # The scikit-build-core compatibility fix is included in the fork commit.


# ZED Camera Odometry
zed_proxy:
  install: false
  path: packages/zed_proxy

