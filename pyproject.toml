[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RoboJuDo"
version = "1.5.0"
description = "RoboJuDo: A plug-and-play deploy framework for robots. Just deploy, just do."
authors = [
    { name = "HansZ8", email = "GDDG80@outlook.com" }
]
readme = "README.md"
requires-python = ">=3.11"

dynamic = ["dependencies"]

[tool.setuptools.packages.find]
include = ["robojudo", "robojudo.*"]

[tool.setuptools.package-data]
"robojudo.motion" = ["resources/**/*.yaml", "resources/**/*.xml", "LICENSE-*", "SOURCE.md"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
mujoco-python-viewer = { path = "third_party/mujoco_viewer", editable = true }
unitree-cpp = { path = "packages/unitree_cpp" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
sim = ["mujoco-python-viewer"]
unitree = ["unitree-cpp"]
dev = [
    "pre-commit==4.3.0",
    "ruff==0.12.7",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["__pycache__", ".venv", "build", "dist", "logs", "data", "robojudo/controller/motion_lib", "robojudo/policy/hilo", "robojudo/policy/gmt","packages", "third_party"]
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["B008"]
lint.fixable = ["ALL"]
